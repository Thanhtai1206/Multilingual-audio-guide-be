[project]
name = "multilingual-audio-guide-be"
version = "1.0.0"
description = "Backend 3 lớp - Thuyết minh tự động đa ngôn ngữ (Chùa Linh Ứng)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/integrations/*"]  # gọi dịch vụ Internet thật, được thay bằng bản giả khi test

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["media", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]
ignore = ["B008", "S105", "S106"]  # B008: FastAPI dùng Depends() làm giá trị mặc định

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106", "S105", "S311"]
"app/db/seed_data.py" = ["E501"]
"app/db/ui_strings.py" = ["E501"]
"app/api/v1/endpoints/mock_gateway.py" = ["E501"]  # HTML/CSS nhúng
