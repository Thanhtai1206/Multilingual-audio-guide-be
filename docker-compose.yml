# Chạy đầy đủ backend + MongoDB thật trên máy:  docker compose up --build
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      # Máy đã cài MongoDB (Windows service) chiếm cổng 27017 -> mở ra ngoài bằng 27018 để không đụng nhau.
      # Container api vẫn nối vào mongo:27017 bên trong mạng Docker. Compass: mongodb://localhost:27018
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: audio_guide
      MEDIA_STORAGE: mongo   # audio lưu trong MongoDB -> chỉ cần giữ volume của mongo

volumes:
  mongo_data:
