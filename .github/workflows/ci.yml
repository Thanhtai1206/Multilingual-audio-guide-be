# CI - Continuous Integration
# Chạy mỗi khi push hoặc mở Pull Request: kiểm tra code style -> test từng lớp -> build Docker.
# PR chỉ được merge khi tất cả job xanh (bật "Branch protection" cho nhánh main).
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install ruff==0.8.4
      - name: Kiểm tra lỗi code
        run: ruff check .
      - name: Kiểm tra định dạng code
        run: ruff format --check .

  test:
    name: Unit test (Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Test lớp API (mock Service)
        run: pytest tests/test_api -q
      - name: Test lớp Service (nghiệp vụ)
        run: pytest tests/test_services -q
      - name: Test lớp Repository (MongoDB giả lập)
        run: pytest tests/test_repositories -q
      - name: Test toàn bộ + đo độ phủ (tối thiểu 80%)
        run: pytest --cov --cov-report=term --cov-report=xml --cov-fail-under=80
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: coverage-report
          path: coverage.xml

  integration:
    name: Integration test (toàn bộ test trên MongoDB 7 thật)
    needs: lint
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_MONGO_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Toàn bộ test (repository, service, E2E, khởi động lại) trên MongoDB 7
        run: pytest -q

  docker:
    name: Build Docker image + smoke test
    needs: [test, integration]
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: audio-guide:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Chạy container và gọi /health
        run: |
          docker run -d --name app --network host -e MONGO_URI=mongodb://localhost:27017 \
            -e TRANSLATOR_PROVIDER=none -e TTS_PROVIDER=none audio-guide:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8000/health/ready; then echo; echo "Container OK"; exit 0; fi
            sleep 2
          done
          docker logs app
          exit 1
