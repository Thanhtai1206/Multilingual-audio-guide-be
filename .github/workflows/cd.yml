# CD - Continuous Delivery/Deployment
# Chỉ chạy khi CI trên nhánh main THÀNH CÔNG:
#   1) Build Docker image và đẩy lên GitHub Container Registry (ghcr.io)
#   2) Gọi Deploy Hook của Render để server kéo bản mới
#   3) Smoke test: gọi /health/ready trên server thật
# Secrets cần tạo (Settings > Secrets and variables > Actions):
#   RENDER_DEPLOY_HOOK_URL  - lấy trong Render > Service > Settings > Deploy Hook
#   APP_URL                 - vd https://linh-ung-audio-guide.onrender.com
# Thiếu secret nào thì bước tương ứng được bỏ qua (workflow vẫn xanh).
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build & push image lên GHCR
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy lên Render
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Gọi Render Deploy Hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::Chưa cấu hình RENDER_DEPLOY_HOOK_URL - bỏ qua bước deploy"
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
          echo "Đã yêu cầu Render deploy bản mới"

      - name: Smoke test server thật
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::warning::Chưa cấu hình APP_URL - bỏ qua smoke test"
            exit 0
          fi
          # Render cần vài phút để build + khởi động (gói free còn "ngủ" khi không dùng)
          for i in $(seq 1 30); do
            if curl -fsS "$APP_URL/health/ready"; then echo; echo "Production OK"; exit 0; fi
            echo "Chưa sẵn sàng, thử lại sau 20s ($i/30)"; sleep 20
          done
          exit 1
